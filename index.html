<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbi Yemek 7</title>
  <link rel="stylesheet" href="site.css">
</head>
<body data-page="home">
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="index.html">Harbi Yemek 7</a>
      <form class="search" role="search" action="index.html" method="get">
        <label class="visually-hidden" for="q">Adres ara</label>
        <input id="q" name="q" type="search" placeholder="Mevcut Adres veya Yeni Adresi Gir" autocomplete="off">
        <div id="address-suggest" class="suggest" role="listbox" hidden></div>
        <div id="address-extra" class="address-extra" hidden>
          <label>Kat <input id="addr-kat" type="text" autocomplete="off" enterkeyhint="next"></label>
          <label>Daire <input id="addr-daire" type="text" autocomplete="off" enterkeyhint="done"></label>
          <button class="btn" type="button" data-action="save-address">Kaydet</button>
          <p id="address-status"></p>
        </div>
      </form>
      <nav class="account" aria-label="Hesap">
        <a href="uye-ol.html">Üye ol</a>
        <span class="slash" aria-hidden="true">/</span>
        <a href="giris.html">Giriş Yap</a>
        <a class="cart" href="siparisler.html" aria-label="Sepet"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 7h14l-1.4 8.2a1 1 0 0 1-1 .8H8.2a1 1 0 0 1-1-.8L5.2 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.3" fill="currentColor"/><circle cx="17" cy="20" r="1.3" fill="currentColor"/></svg></a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <nav class="lanes" aria-label="Kategoriler">
      <h2><button type="button" data-action="show-category" data-category="restoran" aria-pressed="true">Restoran</button></h2>
      <h2><button type="button" data-action="show-category" data-category="su" aria-pressed="false">Su</button></h2>
      <h2><button type="button" data-action="show-category" data-category="market" aria-pressed="false">Market</button></h2>
      <h2><button type="button" data-action="open-apply" data-dialog="courier-dialog" aria-haspopup="dialog">Kurye ol</button></h2>
      <h2><button type="button" data-action="open-apply" data-dialog="restaurant-dialog" aria-haspopup="dialog">Restoran Başvurusu</button></h2>
    </nav>
    <div id="category-panel"></div>
    <dialog id="courier-dialog" class="apply-dialog" aria-labelledby="kurye-ol">
      <h2 id="kurye-ol">Kurye ol</h2>
      <p class="section-note">Başvuru bu pencerede kalır. Onaydan sonra giriş açılır.</p>
      <p id="courier-apply-note" class="notice" hidden></p>
      <form data-form="courier-apply">
        <label class="field">Ad soyad<input name="ad" required></label>
        <label class="field">Telefon<input name="telefon" required></label>
        <label class="field">Mail<input type="email" name="eposta" required></label>
        <label class="field">Şifre<input type="password" name="sifre" required></label>
        <label class="field">Şehir<select name="il" required></select></label>
        <button class="btn" type="submit">Başvur</button>
      </form>
      <button class="btn ghost" type="button" data-action="close-apply">Kapat</button>
    </dialog>
    <dialog id="restaurant-dialog" class="apply-dialog" aria-labelledby="restoran-basvuru">
      <h2 id="restoran-basvuru">Restoran Başvurusu</h2>
      <p class="section-note">Başvuru bu pencerede kalır.</p>
      <p id="restaurant-apply-note" class="notice" hidden></p>
      <form data-form="restaurant-apply">
        <label class="field">Restoran adı<input name="ad" required></label>
        <label class="field">Telefon<input name="telefon" required></label>
        <label class="field">E-posta<input type="email" name="eposta" required></label>
        <label class="field">Adres<input name="adres" required></label>
        <label class="field">Şehir<select name="il" required></select></label>
        <button class="btn" type="submit">Başvur</button>
      </form>
      <button class="btn ghost" type="button" data-action="close-apply">Kapat</button>
    </dialog>
  </main>

  <footer class="site-footer">
    <p>Harbi Yemek 7</p>
  </footer>
  <script src="site.js"></script>
</body>
</html>
