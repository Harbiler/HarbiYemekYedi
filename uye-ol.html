<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Üye ol — Harbi Yemek 7</title>
  <link rel="stylesheet" href="site.css">
</head>
<body data-page="signup">
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="index.html">Harbi Yemek 7</a>
      <form class="search" role="search" action="index.html" method="get">
        <label class="visually-hidden" for="q">Restoran veya yemek ara</label>
        <input id="q" name="q" type="search" placeholder="Mevcut Adres veya Yeni Adresi Gir" autocomplete="off">
      </form>
      <nav class="account" aria-label="Hesap">
        <a href="uye-ol.html" aria-current="page">Üye ol</a>
        <span class="slash" aria-hidden="true">/</span>
        <a href="giris.html">Giriş Yap</a>
        <a class="cart" href="siparisler.html" aria-label="Sepet"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 7h14l-1.4 8.2a1 1 0 0 1-1 .8H8.2a1 1 0 0 1-1-.8L5.2 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.3" fill="currentColor"/><circle cx="17" cy="20" r="1.3" fill="currentColor"/></svg></a>
      </nav>
    </div>
  </header>

  <main class="panel">
    <h1>Üye ol</h1>
    <p class="section-note">Kayıt yalnızca bu tarayıcıda durur.</p>
    <p id="signup-note" class="notice" hidden></p>
    <form data-form="signup">
      <label class="field">Ad soyad
        <input type="text" name="ad" autocomplete="name" required>
      </label>
      <label class="field">E-posta
        <input type="email" name="eposta" autocomplete="email" required>
      </label>
      <label class="field">Şifre
        <input type="password" name="sifre" autocomplete="new-password" required>
      </label>
      <label class="field">İl
        <select name="il" required>
          <option value="">İl seçin</option>
        </select>
      </label>
      <label class="field">İlçe
        <select name="ilce" required>
          <option value="">İlçe seçin</option>
        </select>
      </label>
      <label class="field">Adres
        <input type="text" name="adres" autocomplete="street-address" required>
      </label>
      <label class="field">Kat
        <input type="text" name="kat" autocomplete="off" required>
      </label>
      <label class="field">Daire
        <input type="text" name="daire" autocomplete="address-line2" required>
      </label>
      <button class="btn" type="submit">Üye ol</button>
    </form>
    <a class="back" href="index.html">Ana sayfaya dön</a>
  </main>
  <script src="site.js"></script>
</body>
</html>
