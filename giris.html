<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap — Harbi Yemek 7</title>
  <link rel="stylesheet" href="site.css">
</head>
<body data-page="login">
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="index.html">Harbi Yemek 7</a>
      <form class="search" role="search" action="index.html" method="get">
        <label class="visually-hidden" for="q">Restoran veya yemek ara</label>
        <input id="q" name="q" type="search" placeholder="Restoran veya yemek ara" autocomplete="off">
      </form>
      <nav class="account" aria-label="Hesap">
        <a href="uye-ol.html">Üye ol</a>
        <span class="slash" aria-hidden="true">/</span>
        <a href="giris.html" aria-current="page">Giriş Yap</a>
      </nav>
    </div>
  </header>

  <div class="login-grid stack">
    <section class="panel">
      <h1>Müşteri</h1>
      <p id="customer-note" class="notice warn" hidden></p>
      <form data-form="login-customer">
        <label class="field">E-posta
          <input type="email" name="eposta" autocomplete="username" required>
        </label>
        <label class="field">Şifre
          <input type="password" name="sifre" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit">Giriş Yap</button>
      </form>
    </section>

    <section class="panel">
      <h1>Restoran</h1>
      <p id="restaurant-note" class="notice warn" hidden></p>
      <form data-form="login-restaurant">
        <label class="field">Restoran
          <select id="restaurant-select" name="restaurant"></select>
        </label>
        <button class="btn" type="submit">Giriş Yap</button>
      </form>
    </section>

    <section class="panel">
      <p class="eyebrow">Harbi Kuryeler</p>
      <h1>Kurye</h1>
      <p class="section-note">Deneme kurye hesabı. Sırayla sipariş düşer.</p>
      <form data-form="login-courier">
        <label class="field">Kurye
          <select id="courier-select" name="courier"></select>
        </label>
        <button class="btn" type="submit">Giriş Yap</button>
      </form>
    </section>
  </div>
  <script src="site.js"></script>
</body>
</html>
