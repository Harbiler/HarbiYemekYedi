<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap — Harbi Yemek 7</title>
  <link rel="stylesheet" href="site.css">
</head>
<body data-page="login">
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="index.html">Harbi Yemek 7</a>
      <form class="search" role="search" action="index.html" method="get">
        <label class="visually-hidden" for="q">Restoran veya yemek ara</label>
        <input id="q" name="q" type="search" placeholder="Mevcut Adres veya Yeni Adresi Gir" autocomplete="off">
      </form>
      <nav class="account" aria-label="Hesap">
        <a href="uye-ol.html">Üye ol</a>
        <span class="slash" aria-hidden="true">/</span>
        <a href="giris.html" aria-current="page">Giriş Yap</a>
        <a class="cart" href="siparisler.html" aria-label="Sepet"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 7h14l-1.4 8.2a1 1 0 0 1-1 .8H8.2a1 1 0 0 1-1-.8L5.2 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.3" fill="currentColor"/><circle cx="17" cy="20" r="1.3" fill="currentColor"/></svg></a>
      </nav>
    </div>
  </header>

  <div class="login-grid stack">
    <section class="panel">
      <h1>Müşteri</h1>
      <p id="customer-note" class="notice warn" hidden></p>
      <form data-form="login-customer">
        <label class="field">E-posta
          <input type="email" name="eposta" autocomplete="username" required>
        </label>
        <label class="field">Şifre
          <input id="customer-password" type="password" name="sifre" autocomplete="current-password" required>
        </label>
        <div class="login-tools">
          <button class="text-btn" type="button" data-action="toggle-password" data-target="customer-password" aria-pressed="false">Şifreyi göster</button>
          <button class="text-btn" type="button" data-action="forgot-password">Şifremi unuttum</button>
          <label class="remember"><input type="checkbox" name="hatirla"> Beni Hatırla</label>
        </div>
        <div id="forgot-box" class="forgot-box" hidden>
          <label class="field">Yeni şifre
            <input id="yeni-sifre" type="password" name="yeni" autocomplete="new-password">
          </label>
          <button class="text-btn" type="button" data-action="reset-password">Yeni şifreyi kaydet</button>
        </div>
        <button class="btn" type="submit">Giriş Yap</button>
      </form>
    </section>
  </div>
  <script src="site.js"></script>
</body>
</html>
