<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İş ortağı ol — Harbi Yemek 7</title>
  <link rel="stylesheet" href="site.css">
</head>
<body data-page="partner">
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="index.html">Harbi Yemek 7</a>
      <form class="search" role="search" action="index.html" method="get">
        <label class="visually-hidden" for="q">Restoran veya yemek ara</label>
        <input id="q" name="q" type="search" placeholder="Mevcut Adres veya Yeni Adresi Gir" autocomplete="off">
      </form>
      <nav class="account" aria-label="Hesap">
        <a href="uye-ol.html">Üye ol</a>
        <span class="slash" aria-hidden="true">/</span>
        <a href="giris.html">Giriş Yap</a>
        <a href="is-ortagi.html" aria-current="page">İş ortağı ol</a>
        <a class="cart" href="siparisler.html" aria-label="Sepet"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 7h14l-1.4 8.2a1 1 0 0 1-1 .8H8.2a1 1 0 0 1-1-.8L5.2 4.5H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.3" fill="currentColor"/><circle cx="17" cy="20" r="1.3" fill="currentColor"/></svg></a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>İş ortağı ol</h1>
    <p class="section-note">İşletme veya kurye başvurusunu tıklayınca form açılır. Admin onaylayınca hesap aktif olur ve giriş açılır.</p>

    <section class="sheet" aria-labelledby="isletme-basvuru">
      <h2 id="isletme-basvuru">
        <button type="button" class="section-toggle" data-action="toggle-partner-panel" aria-expanded="false" aria-controls="business-apply-panel">İşletme başvurusu</button>
      </h2>
      <div id="business-apply-panel" class="partner-apply-panel" hidden>
        <p class="section-note">Tür ve ilçe seçin. Onaydan önce işletme listede görünmez.</p>
        <p id="partner-apply-note" class="notice" hidden></p>
        <form data-form="partner-apply">
          <label class="field">İşletme türü
            <select name="tur" required>
              <option value="">Seçin</option>
              <option value="restoran">Restoran</option>
              <option value="su">Su</option>
              <option value="market">Market</option>
              <option value="cicekci">Çiçekçi</option>
            </select>
          </label>
          <label class="field">İşletme adı<input name="ad" required></label>
          <label class="field">Telefon<input name="telefon" required></label>
          <label class="field">E-posta<input type="email" name="eposta" required></label>
          <label class="field">Şifre<input type="password" name="sifre" required></label>
          <label class="field">Adres<input name="adres" required></label>
          <label class="field">İl<select name="il" required></select></label>
          <label class="field">İlçe
            <select name="ilce" required>
              <option value="">İlçe seçin</option>
            </select>
          </label>
          <label class="field" id="partner-photo-field" hidden>İşletme profil resmi<input name="resim" type="file" accept="image/*"></label>
          <button class="btn" type="submit">Başvur</button>
        </form>
      </div>
    </section>

    <section class="sheet" aria-labelledby="kurye-basvuru">
      <h2 id="kurye-basvuru">
        <button type="button" class="section-toggle" data-action="toggle-partner-panel" aria-expanded="false" aria-controls="courier-apply-panel">Kurye başvurusu</button>
      </h2>
      <div id="courier-apply-panel" class="partner-apply-panel" hidden>
        <p class="section-note">Profil resmi zorunlu. Onaydan önce sipariş atanmaz ve giriş açılmaz.</p>
        <p id="courier-apply-note" class="notice" hidden></p>
        <form data-form="courier-apply">
          <label class="field">Ad soyad<input name="ad" required></label>
          <label class="field">Telefon<input name="telefon" required></label>
          <label class="field">Mail<input type="email" name="eposta" required></label>
          <label class="field">Şifre<input type="password" name="sifre" required></label>
          <label class="field">İl<select name="il" required></select></label>
          <label class="field">İlçe
            <select name="ilce" required>
              <option value="">İlçe seçin</option>
            </select>
          </label>
          <label class="field">Adres<input name="adres" required></label>
          <label class="field">Profil resmi<input name="resim" type="file" accept="image/*" required></label>
          <button class="btn" type="submit">Başvur</button>
        </form>
      </div>
    </section>
  </main>
  <script src="site.js"></script>
</body>
</html>
